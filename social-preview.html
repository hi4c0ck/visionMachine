<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VisionMachine — Social Preview 1280×640</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: linear-gradient(160deg, #2b2b2b 0%, #1e1e1e 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Top row: watermark left, icon right */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 32px 40px 0 0;
    height: 80px;
    flex-shrink: 0;
  }

  .watermark {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #5a5a5a;
    user-select: none;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    object-fit: contain;
  }

  /* Center content */
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 60px;
  }

  .title {
    font-size: 88px;
    font-weight: 800;
    color: #e8a820;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 16px;
  }

  .tagline {
    font-size: 22px;
    font-weight: 400;
    color: #d0d0d0;
    letter-spacing: 0.5px;
  }

  .tagline em {
    font-style: normal;
    color: #c9a84c;
  }

  /* Cinema strip at bottom */
  .film-strip {
    flex-shrink: 0;
    padding: 0 40px 28px 40px;
  }

  .strip-inner {
    display: flex;
    align-items: center;
    gap: 0;
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    height: 56px;
    border: 1px solid #333;
  }

  /* Perforations */
  .perforation {
    width: 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .perforation span {
    width: 12px;
    height: 8px;
    background: #2b2b2b;
    border-radius: 2px;
  }

  /* Frames */
  .frames {
    display: flex;
    flex: 1;
    gap: 4px;
    padding: 8px 12px;
    overflow: hidden;
  }

  .frame {
    flex: 1;
    height: 40px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .frame-1 { background: linear-gradient(135deg, #1a3a4a, #2a5a6a); }
  .frame-2 { background: linear-gradient(135deg, #3a2a1a, #5a4a2a); }
  .frame-3 { background: linear-gradient(135deg, #2a1a3a, #4a3a5a); }
  .frame-4 { background: linear-gradient(135deg, #1a3a2a, #2a5a4a); }
  .frame-5 { background: linear-gradient(135deg, #3a1a1a, #5a2a2a); }
  .frame-6 { background: linear-gradient(135deg, #1a2a3a, #2a4a5a); }

  /* Subtle play icon on one frame */
  .frame-3::after {
    content: '▶';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.4);
    font-size: 18px;
  }

  /* Small label under strip */
  .strip-label {
    text-align: right;
    margin-top: 6px;
    font-size: 11px;
    color: #444;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <!-- Top: watermark + logo -->
  <div class="top-row">
    <div class="watermark">HORIZONES MACHINES</div>
    <img class="logo" src="public-static/icons/vm-mark-256.png" alt="VM">
  </div>

  <!-- Center: title + tagline -->
  <div class="center">
    <div class="title">VisionMachine</div>
    <div class="tagline">Director-style AI video studio — free, local, <em>shot-by-shot</em>.</div>
  </div>

  <!-- Bottom: cinema strip -->
  <div class="film-strip">
    <div class="strip-inner">
      <div class="perforation"><span></span><span></span><span></span></div>
      <div class="frames">
        <div class="frame frame-1"></div>
        <div class="frame frame-2"></div>
        <div class="frame frame-3"></div>
        <div class="frame frame-4"></div>
        <div class="frame frame-5"></div>
        <div class="frame frame-6"></div>
      </div>
      <div class="perforation"><span></span><span></span><span></span></div>
    </div>
    <div class="strip-label">Timeline · Keyframes · Generate</div>
  </div>

</body>
</html>
