[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "vision-machine"
version = "0.1.0"
description = "A comprehensive vision processing and machine learning pipeline platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "HorizonsMachine"}
]
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "opencv-python-headless>=5.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.13.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true