<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Thumb Slider Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px;
    }
    .demo { max-width: 600px; margin: 0 auto; }
    h2 { color: #58a6ff; margin-bottom: 20px; }
    .example {
      margin-bottom: 40px;
      padding: 20px;
      background: #161b22;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    .example label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Slider styles ───────────────────────── */
    .multi-thumb-slider {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 0;
      width: 100%;
    }
    
    .slider-label {
      font-size: 10px;
      font-weight: 600;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-left: 4px;
    }
    
    .slider-wrapper {
      position: relative;
      padding: 20px 0 24px;
    }
    
    .track-container {
      position: relative;
      height: 4px;
      margin: 18px 0;
    }
    
    .track-bg {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    
    .track-fill {
      position: absolute;
      height: 100%;
      background: var(--track-color);
      border-radius: 2px;
      opacity: 0.8;
      transition: left 0.06s ease-out, width 0.06s ease-out;
    }
    
    .inputs-stack {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .input-layer {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
    }
    
    .range-input {
      position: absolute;
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      margin: 0;
    }
    
    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--track-color);
      border: 2px solid rgba(0,0,0,0.3);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: grab;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    
    .range-input::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.15);
    }
    
    .range-input::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--track-color);
      border: 2px solid rgba(0,0,0,0.3);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: grab;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    
    .range-input:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.4), 0 2px 6px rgba(0,0,0,0.4);
    }
    
    .input-a .range-input::-webkit-slider-thumb { background: #58a6ff; }
    .input-a .range-input::-moz-range-thumb { background: #58a6ff; }
    
    .input-b .range-input::-webkit-slider-thumb { background: #3fb950; }
    .input-b .range-input::-moz-range-thumb { background: #3fb950; }
    
    .thumb-label {
      position: absolute;
      top: -24px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      color: #8b949e;
      pointer-events: none;
      white-space: nowrap;
      transition: left 0.06s ease-out;
    }
    
    .thumb-label-a { color: #58a6ff; }
    .thumb-label-b { color: #3fb950; }
    
    .value-badges {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      margin-top: 8px;
    }
    
    .badge {
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .dot-a { background: #58a6ff; }
    .dot-b { background: #3fb950; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Multi-Thumb Slider Test</h2>
    
    <div class="example">
      <label>Basic Range (0–100)</label>
      <div id="slider1" class="multi-thumb-slider" style="--track-color: rgb(88, 166, 255)">
        <div class="slider-wrapper">
          <div class="track-container">
            <div class="track-bg"></div>
            <div class="track-fill" id="fill1"></div>
          </div>
          
          <div class="inputs-stack">
            <div class="input-layer input-a">
              <input type="range" min="0" max="100" value="30" 
                     oninput="updateSlider('slider1', 'a', this.value)"
                     class="range-input" />
              <div class="thumb-label thumb-label-a" id="label-a-1" style="left: 30%">30</div>
            </div>
            
            <div class="input-layer input-b">
              <input type="range" min="0" max="100" value="70" 
                     oninput="updateSlider('slider1', 'b', this.value)"
                     class="range-input" />
              <div class="thumb-label thumb-label-b" id="label-b-1" style="left: 70%">70</div>
            </div>
          </div>
          
          <div class="value-badges">
            <span class="badge badge-a"><span class="dot dot-a"></span><span id="val-a-1">30</span></span>
            <span class="badge badge-b"><span class="dot dot-b"></span><span id="val-b-1">70</span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="example">
      <label>Preset Range (-50 to 50)</label>
      <div id="slider2" class="multi-thumb-slider" style="--track-color: rgb(163, 113, 247)">
        <div class="slider-wrapper">
          <div class="track-container">
            <div class="track-bg"></div>
            <div class="track-fill" id="fill2"></div>
          </div>
          
          <div class="inputs-stack">
            <div class="input-layer input-a">
              <input type="range" min="-50" max="50" value="-30" 
                     oninput="updateSlider('slider2', 'a', this.value)"
                     class="range-input" />
              <div class="thumb-label thumb-label-a" id="label-a-2" style="left: 20%">-30</div>
            </div>
            
            <div class="input-layer input-b">
              <input type="range" min="-50" max="50" value="20" 
                     oninput="updateSlider('slider2', 'b', this.value)"
                     class="range-input" />
              <div class="thumb-label thumb-label-b" id="label-b-2" style="left: 70%">20</div>
            </div>
          </div>
          
          <div class="value-badges">
            <span class="badge badge-a"><span class="dot dot-a"></span><span id="val-a-2">-30</span></span>
            <span class="badge badge-b"><span class="dot dot-b"></span><span id="val-b-2">20</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateSlider(sliderId, thumb, value) {
      const el = document.getElementById(sliderId);
      const val = parseInt(value);
      const min = parseInt(el.querySelector('input').min);
      const max = parseInt(el.querySelector('input').max);
      const pct = ((val - min) / (max - min)) * 100;
      
      // Update label position and value
      const labelId = thumb === 'a' ? `label-a-${sliderId.replace('slider', '')}` : `label-b-${sliderId.replace('slider', '')}`;
      const labelEl = document.getElementById(labelId);
      if (labelEl) {
        labelEl.style.left = `${pct}%`;
        labelEl.textContent = val;
      }
      
      // Update value badge
      const valId = thumb === 'a' ? `val-a-${sliderId.replace('slider', '')}` : `val-b-${sliderId.replace('slider', '')}`;
      const valEl = document.getElementById(valId);
      if (valEl) valEl.textContent = val;
      
      // Update fill
      const fillId = `fill${sliderId.replace('slider', '')}`;
      const fillEl = document.getElementById(fillId);
      if (fillEl) {
        const inputs = el.querySelectorAll('input[type="range"]');
        const a = parseInt(inputs[0].value);
        const b = parseInt(inputs[1].value);
        const aPct = ((a - min) / (max - min)) * 100;
        const bPct = ((b - min) / (max - min)) * 100;
        
        if (aPct <= bPct) {
          fillEl.style.left = `${aPct}%`;
          fillEl.style.width = `${bPct - aPct}%`;
        } else {
          fillEl.style.left = `${bPct}%`;
          fillEl.style.width = `${aPct - bPct}%`;
        }
      }
    }

    // Initialize fills
    window.addEventListener('DOMContentLoaded', () => {
      ['slider1', 'slider2'].forEach(id => {
        const el = document.getElementById(id);
        const inputs = el.querySelectorAll('input[type="range"]');
        updateSlider(id, 'a', inputs[0].value);
        updateSlider(id, 'b', inputs[1].value);
      });
    });
  </script>
</body>
</html>
