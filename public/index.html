<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionMachine - AI Video Generator</title>
  <!-- VisionMachine brand: amber V+M interlock with bluish play-node (variant 145721, keyed transparent) -->
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/vm-favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/vm-favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/vm-favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/vm-favicon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/vm-favicon-192.png" />
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    body { margin: 0; background: #0a0a0f; }
    #debug-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; z-index: 9999;
      background: #0a0a0f; color: #fff; font-family: Inter, sans-serif;
    }
    #debug-overlay.hidden { display: none; }
    .debug-dot { width: 12px; height: 12px; border-radius: 50%; }
    .debug-dot.ok { background: #4ade80; }
    .debug-dot.fail { background: #f87171; }
    .debug-dot.wait { background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div id="debug-overlay">
    <div style="font-size: 24px; font-weight: 600;">VisionMachine</div>
    <div id="debug-status" style="font-size: 14px; color: #888;">Initializing...</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const statusEl = document.getElementById('debug-status');
    const overlayEl = document.getElementById('debug-overlay');
    function setDebug(msg, type) {
      statusEl.textContent = msg;
      statusEl.style.color = type === 'ok' ? '#4ade80' : type === 'fail' ? '#f87171' : '#888';
    }
  </script>
  <script>
    // Hide overlay once app is ready
    setTimeout(() => {
      if (!document.getElementById('app').hasChildNodes()) {
        setDebug('Loading...', 'wait');
      }
    }, 2000);
    const observer = new MutationObserver(() => {
      if (document.getElementById('app').children.length > 0) {
        overlayEl.classList.add('hidden');
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('app'), { childList: true });
  </script>
</body>
</html>
