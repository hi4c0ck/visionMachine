name: Release

# Incremental releases: when a 0.1.0.x tag is pushed (from the release branch),
# build a Windows MSI + portable EXE and publish them as a GitHub Release.
on:
  push:
    tags:
      - '0.1.0.*'
      - 'v0.1.0.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Tauri produces the platform installer (MSI) + the standalone exe.
      - name: Build (tauri)
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse src-tauri/target/release/vision-machine.exe | Select-Object -First 1
          $msi = Get-ChildItem -Recurse 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe.FullName  ./artifacts/
          Copy-Item $msi.FullName  ./artifacts/
          Get-ChildItem ./artifacts | ForEach-Object { Write-Output "artifact: $($_.Name)" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ./artifacts/vision-machine.exe
            ./artifacts/*.msi
