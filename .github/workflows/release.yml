name: Release (build on tag)

# Build Windows MSIs + a Linux AppImage when a vX.Y.Z tag is pushed that
# points at a commit reachable from the `production` branch, and publish
# them to a single GitHub Release.
#
# The "production only" guard prevents a stray tag cut on develop or a
# feature branch from building untested installers. A tag whose commit is
# not reachable from production fails the guard and the jobs are skipped.
#
# No code-signing certificate is configured yet, so the published MSIs are
# unsigned (SmartScreen will show a warning — see the note in README.md).
# The Linux AppImage is unsigned by design (AppImage has no native signing
# chain); distros with AppArmor policies may prompt on first launch.
#
# The final publish job waits for BOTH platform build jobs and then creates
# / updates the GitHub Release with all installers, so the release page
# lists Windows + Linux assets in one place.

on:
  push:
    tags:
      - 'v*'
  # Allow manual runs for testing the pipeline without pushing a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-guard:
    name: "Guard: tag must be on production"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the ancestry check)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the tag is reachable from production
        run: |
          git fetch origin production
          # If the tagged commit is NOT reachable from production's tip,
          # abort so no MSI is built from non-stable code.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on production; refusing to build an MSI from unstable code."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on production — proceeding."

  build-release:
    name: Build Windows MSI
    needs: [check-guard]
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache ffmpeg sidecar download
        uses: actions/cache@v6
        with:
          # fetch-ffmpeg.mjs is cache-aware (downloads the pinned Btbn archive
          # into build-state/ffmpeg-cache/, keyed on tag + target) — caching it
          # here skips the ~155 MB GitHub download on repeat release runs.
          path: build-state/ffmpeg-cache/
          key: visionmachine-ffmpeg-${{ runner.os }}-x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      # ── Variant 1: tiny (no bundled ffmpeg) ──────────────────────────────
      # The app resolves ffmpeg at runtime: user-set path (Settings → Tools)
      # → system $PATH. Covers pipe-only generation with no extra setup;
      # session compose works when the user adds an ffmpeg path.
      - name: Build tiny-variant MSI (no bundled ffmpeg)
        run: node scripts/build/runner.mjs --light

      - name: Capture tiny MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-msi | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi ./release-msi/tiny.msi -Force
          Get-ChildItem ./release-msi | Write-Host

      # ── Portable variant (no installer, no ffmpeg) ─────────────────────────
      # The tiny MSI build above already compiled the raw native executable at
      # src-tauri/target/release/vision-machine.exe (Tauri builds the binary
      # first, then wraps it in the MSI). We capture that exe and package it
      # as a plain zip — no installer, no admin, no registry. Ships WITHOUT the
      # bundled ffmpeg sidecar (same as the tiny MSI), so it is the smallest
      # artifact. Runs BEFORE the full-variant build so we grab the tiny
      # (sidecar-free) binary, not one rewritten by the ffmpeg build.
      - name: Package portable zip (no ffmpeg)
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path ./release-portable | Out-Null
          Copy-Item src-tauri/target/release/vision-machine.exe ./release-portable/ -Force
          @'
          VisionMachine (portable) — no installer, no admin, no registry.

          1. Unzip to any folder you like.
          2. Double-click vision-machine.exe.

          Requires the Microsoft Edge WebView2 runtime, which is preinstalled
          on Windows 10/11. On an older system, install it once from
          https://developer.microsoft.com/en-us/microsoft-edge/webview2/.

          Your projects, sessions and generation history live in a per-user
          app-data folder under your Windows user profile. Move that folder to
          carry your work between machines; delete it to reset the app.

          This portable build does NOT bundle ffmpeg, so session-video compose
          needs an ffmpeg path in Settings -> Tools. Pipe generation works out
          of the box.
          '@ | Set-Content ./release-portable/README-portable.txt -Encoding ascii
          $zip = "VisionMachine_${v}_windows_x64_portable.zip"
          Compress-Archive -Path ./release-portable/* -DestinationPath "./$zip" -Force
          Move-Item "./$zip" "./release-portable/$zip"
          Get-ChildItem ./release-portable | Write-Host

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: visionmachine-portable
          path: ./release-portable/*.zip

      # ── Variant 2: full (bundled ffmpeg sidecar, ~155 MB) ────────────────
      # fetch-ffmpeg.mjs downloads the pinned Btbn GPL build for the target
      # triple and stages it into src-tauri/binaries/ (kept out of git);
      # the runner adds the bundled-ffmpeg feature so the sidecar ships.
      - name: Build full-variant MSI (bundled ffmpeg)
        # The runner stages the pinned Btbn sidecar into src-tauri/binaries/
        # (cache-aware: build-state/ffmpeg-cache survives the cargo cache above)
        # and builds with the bundled-ffmpeg feature.
        run: node scripts/build/runner.mjs --light --features bundled-ffmpeg

      - name: Capture full MSI
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/bundle/msi/*.msi ./release-msi/full.msi -Force
          Get-ChildItem ./release-msi | Write-Host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: visionmachine-msi
          path: ./release-msi/*.msi

      # The GitHub Release itself is created by the `publish-release` job,
      # which runs after BOTH platform builds finish and attaches every
      # installer (MSI + AppImage) to a single release page.

      - name: Print build info
        run: |
          Write-Host "Built tiny + full MSIs for release ${{ github.ref_name }}"

  build-linux:
    name: Build Linux AppImage
    needs: [check-guard]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + ffmpeg sidecar
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/git/db/
            src-tauri/target/
            build-state/ffmpeg-cache/
          key: ${{ runner.os }}-release-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      # Full variant: bundle the pinned Btbn ffmpeg sidecar so session compose
      # works out of the box on Linux too (same shape as the full MSI).
      # No explicit --target: this IS the host triple, and passing it would make
      # Tauri nest the whole build under target/x86_64-unknown-linux-gnu/,
      # diverging from the capture path below (and from the Windows job, which
      # builds natively into target/release/). ffmpeg staging defaults to the
      # host triple when --target is absent, so this is a no-op for sidecar
      # selection. tauri.conf.json declares targets: ["msi", "appimage"] —
      # Tauri filters to the host platform, so only the AppImage is produced.
      - name: Build full-variant AppImage (bundled ffmpeg)
        run: node scripts/build/runner.mjs --light --features bundled-ffmpeg

      - name: Assert AppImage produced
        run: |
          # tauri's bundling stdout is swallowed by the runner, so assert the
          # artifact exists on disk to turn a silently-skipped bundle into a
          # clear, diagnosable failure (with the build log surfaced).
          if ! ls src-tauri/target/release/bundle/appimage/*.AppImage 1>/dev/null 2>&1; then
            echo "ERROR: tauri build finished but produced no AppImage."
            echo "--- last tauri build log ---"
            tail -40 build-state/build-*.log 2>/dev/null || echo "(no build log found)"
            echo "--- any appimage dirs ---"
            find src-tauri/target -type d -name appimage 2>/dev/null || true
            exit 1
          fi
          echo "AppImage present:"
          ls -la src-tauri/target/release/bundle/appimage/

      - name: Capture AppImage
        run: |
          # NOTE: the staging dir must NOT be dot-prefixed. actions/upload-artifact
          # treats leading-dot entries as hidden and will skip their contents
          # ("No files were found"), so we use a plain `release-appimage/` name.
          mkdir -p ./release-appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage ./release-appimage/full.AppImage
          ls -la ./release-appimage/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: visionmachine-appimage
          path: ./release-appimage/*.AppImage

  publish-release:
    name: Publish GitHub Release
    needs: [build-release, build-linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download MSIs
        uses: actions/download-artifact@v8
        with:
          name: visionmachine-msi
          path: ./release-assets

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: visionmachine-appimage
          path: ./release-assets

      - name: Download portable zip
        uses: actions/download-artifact@v8
        with:
          name: visionmachine-portable
          path: ./release-assets

      # Release body = the user-facing changelog (top section of
      # release-notes.md, written per docs/CHANGELOG_STYLE.md) plus the
      # installer notes. generate_release_notes is intentionally OFF: it
      # appends the raw dependabot/commit list, which is not user-facing.
      - name: Build release body (changelog + installer notes)
        id: release-body
        run: |
          # Top "# VisionMachine vX.Y.Z" section = the newest entry.
          awk '/^# VisionMachine / { if (seen) exit; seen = 1; print; next } seen { print }' \
            release-notes.md > changelog.md
          cat > installers.md <<'NOTES'
          ## Installers

          **Windows (MSI)** — two variants:

          - **tiny.msi** — no bundled ffmpeg. Pipe generation works out of
            the box; session video compose needs an ffmpeg path in
            Settings → Tools.
          - **full.msi** — ships a bundled ffmpeg sidecar (~155 MB); session
            compose works out of the box. A user-set ffmpeg path still
            takes precedence.

          **Windows (portable)** — no installer:

          - **_portable.zip** — a plain zip of the native executable + a
            short README. No admin, no registry; unzip and run
            `vision-machine.exe`. Requires the Edge WebView2 runtime
            (preinstalled on Windows 10/11). No bundled ffmpeg, so
            session compose needs an ffmpeg path in Settings -> Tools.

          **Linux (AppImage)** — full variant with bundled ffmpeg, works
          out of the box. AppArmor may prompt on first launch.

          **Note:** the MSIs are unsigned (no code-signing certificate
          yet), so Windows SmartScreen will show an "unknown publisher"
          warning on first install. Click **More info → Run anyway**.
          NOTES
          {
            cat changelog.md
            echo
            cat installers.md
          } > body.md
          {
            echo 'release-body<<RELEASE_BODY_DELIM'
            cat body.md
            echo 'RELEASE_BODY_DELIM'
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./release-assets/*.msi
            ./release-assets/*.AppImage
            ./release-assets/*.zip
          body: ${{ steps.release-body.outputs.release-body }}
