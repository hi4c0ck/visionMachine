# Keep the remote labels in lockstep with .github/labels.yml.
# Runs on push to the labels file on develop (plus a weekly catch-up and a
# manual trigger), so labels are created the moment labels.yml lands.

name: Sync labels

on:
  push:
    branches: [develop]
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync labels from .github/labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Desired labels from the declarative file, one per line:
          # "name<TAB>color<TAB>description". PyYAML-free line-walk parser:
          # accumulate name/color/description across an item's lines, flush
          # at the next "  - name:" boundary. Comment/blank lines skipped.
          DESIRED=$(python3 - <<'PY'
          lines = open('.github/labels.yml').read().splitlines()
          out, rec = [], {}
          def flush():
              if rec.get('name'):
                  out.append((rec['name'], rec.get('color',''), rec.get('desc','')))
              rec.clear()
          in_labels = False
          for line in lines:
              s = line.strip()
              if s == 'labels:':
                  in_labels, rec = True, {}
                  continue
              if s == 'deletable:':
                  in_labels, rec = False, {}
                  continue
              if in_labels and s.startswith('- name:'):
                  flush()
                  rec['name'] = s.split(':', 1)[1].strip().strip('"').strip("'")
              elif in_labels and s.startswith('color:'):
                  rec['color'] = s.split(':', 1)[1].strip().strip('"').strip("'")
              elif in_labels and s.startswith('description:'):
                  rec['desc'] = s.split(':', 1)[1].strip().strip('"').strip("'")
              elif in_labels and not s:
                  flush()
          flush()
          print('\n'.join('\t'.join(r) for r in out))
          PY
          )

          # Current remote labels: "name<TAB>color"
          CURRENT=$(gh label list --json name,color --jq '.[] | [.name, .color] | @tsv')

          # Create missing labels.
          while IFS=$'\t' read -r name color desc; do
            [ -z "$name" ] && continue
            if ! echo "$CURRENT" | awk -F'\t' '{print $1}' | grep -qx "$name"; then
              echo "Creating label: $name"
              gh label create "$name" --color "$color" --description "$desc" --force
            fi
          done <<< "$DESIRED"

          # Deletable labels: the sync may delete a remote label only when it is
          # BOTH in the `deletable:` allowlist in labels.yml AND no longer listed
          # above. This protects GitHub's default triage + language labels.
          DELETABLE=$(python3 - <<'PY'
          import re
          lines = open('.github/labels.yml').read().splitlines()
          out = []
          in_block = False
          for line in lines:
              if line.rstrip() == 'deletable:':
                  in_block = True
                  continue
              if in_block and (line.startswith('- ') or line.startswith('  - ')):
                  out.append(line.split('-', 1)[1].strip().strip('"').strip("'"))
              elif in_block and line.strip() and not line.startswith(' '):
                  break  # next top-level key ends the block
          print('\n'.join(out))
          PY
          )

          # Delete only remote labels that are (a) deletable-allowlisted and
          # (b) no longer desired. Never delete default triage/language labels.
          for name in $(echo "$CURRENT" | awk -F'\t' '{print $1}'); do
            if ! echo "$DESIRED" | awk -F'\t' '{print $1}' | grep -qx "$name"; then
              if echo "$DELETABLE" | grep -qx "$name"; then
                echo "Deleting label: $name"
                gh label delete "$name" --yes
              else
                echo "Skipping undeletable remote label: $name"
              fi
            fi
          done

          echo "Label sync complete."
