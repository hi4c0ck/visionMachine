<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionMachine - AI Video Generator</title>
  <style>
    /* Design System - JetBrains Dark Theme */
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-tertiary: #2d2d2d;
      --text-primary: #d4d4d4;
      --text-secondary: #858585;
      --accent-primary: #007acc;
      --accent-hover: #1a8adb;
      --border-color: #3e3e42;
      --success: #4ec9b0;
      --error: #f44747;
      --warning: #dcdcaa;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 600;
    }
    
    .logo-icon { font-size: 28px; }
    
    .header-controls {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .btn:hover { background: var(--border-color); }
    
    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }
    
    .btn-primary:hover { background: var(--accent-hover); }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    
    .welcome-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    
    .welcome-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    
    .welcome-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .welcome-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    
    .input-group {
      margin-bottom: 24px;
      text-align: left;
    }
    
    .input-label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    
    .input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      outline: none;
    }
    
    .input:focus {
      border-color: var(--accent-primary);
    }
    
    .btn-large {
      padding: 14px 32px;
      font-size: 16px;
      min-width: 200px;
    }
    
    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .footer-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .version-badge {
      padding: 4px 10px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      font-size: 12px;
    }
    
    /* Theme Switcher */
    .theme-dropdown {
      position: relative;
    }
    
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      min-width: 180px;
      z-index: 1000;
    }
    
    .theme-dropdown.open .dropdown-menu {
      display: block;
    }
    
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: none;
      background: none;
      color: var(--text-primary);
      width: 100%;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
    }
    
    .dropdown-item:hover { background: var(--bg-tertiary); }
    
    .color-preview {
      display: flex;
      gap: 4px;
    }
    
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    /* Steel Theme */
    [data-theme="steel"] {
      --bg-primary: #1a1f2e;
      --bg-secondary: #212738;
      --bg-tertiary: #2a3142;
      --text-primary: #e8ecef;
      --text-secondary: #a8b5c7;
      --accent-primary: #3498db;
      --accent-hover: #5dade2;
      --border-color: #2f3748;
    }
    
    [data-theme="steel-light"] {
      --bg-primary: #f0f2f5;
      --bg-secondary: #fafbfc;
      --bg-tertiary: #e8ebf0;
      --text-primary: #2c3e50;
      --text-secondary: #5a6c7d;
      --accent-primary: #2980b9;
      --accent-hover: #1a6fa0;
      --border-color: #c8d6e5;
    }
    
    /* JetBrains Light */
    [data-theme="jetbrains-light"] {
      --bg-primary: #f6f8fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f0f2f5;
      --text-primary: #24292f;
      --text-secondary: #57606a;
      --accent-primary: #0969da;
      --accent-hover: #0550ae;
      --border-color: #d0d7de;
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .header { padding: 12px 16px; }
      .main { padding: 20px; }
      .welcome-title { font-size: 24px; }
      .footer { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">VisionMachine</span>
    </div>
    
    <div class="header-controls">
      <!-- Theme Switcher -->
      <div class="theme-dropdown" id="themeDropdown">
        <button class="btn" onclick="toggleThemeMenu()">
          🎨 Theme
        </button>
        <div class="dropdown-menu">
          <button class="dropdown-item" onclick="setTheme('jetbrains-dark')">
            <div class="color-preview">
              <span class="color-dot" style="background: #1e1e1e"></span>
              <span class="color-dot" style="background: #252526"></span>
            </div>
            JetBrains Dark
          </button>
          <button class="dropdown-item" onclick="setTheme('jetbrains-light')">
            <div class="color-preview">
              <span class="color-dot" style="background: #f6f8fa"></span>
              <span class="color-dot" style="background: #ffffff"></span>
            </div>
            JetBrains Light
          </button>
          <button class="dropdown-item" onclick="setTheme('steel-dark')">
            <div class="color-preview">
              <span class="color-dot" style="background: #1a1f2e"></span>
              <span class="color-dot" style="background: #212738"></span>
            </div>
            Steel Dark
          </button>
          <button class="dropdown-item" onclick="setTheme('steel-light')">
            <div class="color-preview">
              <span class="color-dot" style="background: #f0f2f5"></span>
              <span class="color-dot" style="background: #fafbfc"></span>
            </div>
            Steel Light
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="welcome-card">
      <div class="welcome-icon">🎬</div>
      <h1 class="welcome-title" id="welcomeTitle">Welcome to VisionMachine</h1>
      <p class="welcome-subtitle" id="welcomeSubtitle">Your AI-powered video generation companion</p>
      
      <div class="input-group" id="nameInputGroup">
        <label class="input-label" for="username">What's your name?</label>
        <input 
          type="text" 
          id="username" 
          class="input" 
          placeholder="Enter your display name..."
          autocomplete="off"
        >
      </div>
      
      <button class="btn btn-primary btn-large" id="actionButton" onclick="handleAction()">
        Get Started
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <button class="btn" onclick="showAbout()">ℹ️ About</button>
      <button class="btn" onclick="showBuildInfo()">📦 Build Info</button>
    </div>
    
    <div class="footer-right">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="checkUpdates">
        <span>Check for updates</span>
      </label>
      <span class="version-badge">v0.1.0</span>
    </div>
  </footer>

  <script>
    // Configuration
    const API_BASE = 'http://localhost:8765';
    
    // State
    let userName = localStorage.getItem('vm-username') || '';
    let currentUser = localStorage.getItem('vm-user') || '';
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('vm-theme') || 'jetbrains-dark';
      setTheme(savedTheme);
      
      if (userName) {
        showMainApp();
      } else {
        showWelcomePage();
      }
      
      // Enter key support
      document.getElementById('username').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAction();
      });
    });
    
    // Theme functions
    function toggleThemeMenu() {
      document.getElementById('themeDropdown').classList.toggle('open');
    }
    
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('vm-theme', theme);
      document.getElementById('themeDropdown').classList.remove('open');
    }
    
    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.theme-dropdown')) {
        document.getElementById('themeDropdown').classList.remove('open');
      }
    });
    
    // Navigation functions
    function showWelcomePage() {
      document.getElementById('welcomeTitle').textContent = 'Welcome to VisionMachine';
      document.getElementById('welcomeSubtitle').textContent = 'Your AI-powered video generation companion';
      document.getElementById('nameInputGroup').style.display = 'block';
      document.getElementById('actionButton').textContent = 'Get Started';
      document.getElementById('username').value = '';
      document.getElementById('username').disabled = false;
    }
    
    function showMainApp() {
      document.getElementById('welcomeTitle').textContent = `Hello, ${userName}!`;
      document.getElementById('welcomeSubtitle').textContent = 'Ready to create amazing videos?';
      document.getElementById('nameInputGroup').style.display = 'none';
      document.getElementById('actionButton').textContent = 'Continue →';
      document.getElementById('actionButton').onclick = goToWorkspace;
    }
    
    function handleAction() {
      const input = document.getElementById('username');
      const name = input.value.trim();
      
      if (!name) {
        input.style.borderColor = 'var(--error)';
        input.focus();
        return;
      }
      
      userName = name;
      localStorage.setItem('vm-username', name);
      currentUser = name;
      
      showMainApp();
    }
    
    async function goToWorkspace() {
      try {
        // Test API connection
        const response = await fetch(`${API_BASE}/health`);
        if (response.ok) {
          alert(`Workspace ready!\n\n✅ Backend connected at ${API_BASE}\n👤 User: ${userName}\n\nVideo generation coming soon...`);
        } else {
          throw new Error('API not responding');
        }
      } catch (error) {
        alert('Backend not running.\n\nStart the API server:\n  python api_server.py\n\nThen refresh this page.');
      }
    }
    
    // Utility functions
    function showAbout() {
      alert('VisionMachine v0.1.0\n\nAI-Powered Video Generation Desktop App\n\n© 2026 HorizonsMachine\n\nFeatures:\n• Multi-shot video generation\n• Secure API key management\n• Modern dark-themed UI\n• Cross-platform support');
    }
    
    function showBuildInfo() {
      const date = new Date().toISOString().split('T')[0];
      alert(`VisionMachine\nBuild: ${date}\nPlatform: Web/Desktop\nVersion: 0.1.0`);
    }
  </script>
</body>
</html>
