# See https://doc.rust-lang.org/cargo/appendix/glossary.html
[package]
name = "vision-machine"
version = "0.1.0"
description = "VisionMachine - AI Video Generator Desktop App"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vision_machine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Section specific to tauri v2
[[bin]]
name = "tauri_app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
