<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TwoThumbSlider — Simple Working</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
      padding: 40px;
    }
    
    .demo { max-width: 500px; margin: 0 auto; }
    h1 { color: #a8b5d6; margin-bottom: 8px; font-weight: 500; }
    p.subtitle { font-size: 12px; color: #6e7681; margin-bottom: 32px; }
    
    /* ── Simple Two-Thumb Slider ───────── */
    .slider-wrapper {
      margin-bottom: 32px;
    }
    
    .label {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    
    .track {
      position: relative;
      height: 40px;
      display: flex;
      align-items: center;
    }
    
    /* Background rail */
    .rail {
      position: absolute;
      left: 0; right: 0;
      height: 6px;
      background: #21262d;
      border-radius: 3px;
    }
    
    /* Fill between thumbs */
    .fill {
      position: absolute;
      height: 6px;
      border-radius: 3px;
      pointer-events: none;
    }
    
    /* Range inputs - transparent but functional */
    .range-input {
      position: absolute;
      width: 100%;
      height: 40px;
      margin: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      z-index: 2;
    }
    
    /* Hide default track */
    .range-input::-webkit-slider-runnable-track {
      height: 40px;
      background: transparent;
    }
    
    .range-input::-moz-range-track {
      height: 40px;
      background: transparent;
      border: none;
    }
    
    /* Custom thumbs */
    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: grab;
      margin-top: -7px;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    
    .range-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    
    /* Left thumb (blue) */
    .range-left::-webkit-slider-thumb {
      background: #58a6ff;
    }
    
    .range-left::-moz-range-thumb {
      background: #58a6ff;
    }
    
    /* Right thumb (green) */
    .range-right::-webkit-slider-thumb {
      background: #3fb950;
    }
    
    .range-right::-moz-range-thumb {
      background: #3fb950;
    }
    
    /* Value display */
    .values {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .value-left { color: #58a6ff; }
    .value-right { color: #3fb950; }
  </style>
</head>
<body>
  <div class="demo">
    <h1>TwoThumbSlider — Working Demo</h1>
    <p class="subtitle">Drag thumbs to adjust range (min 8-unit gap)</p>
    
    <!-- Example 1 -->
    <div class="slider-wrapper">
      <div class="label">Position Range (0–100)</div>
      <div class="track">
        <div class="rail"></div>
        <div class="fill" id="fill-1" style="left: 30%; width: 40%; background: #58a6ff; opacity: 0.6;"></div>
        
        <!-- Left thumb -->
        <input type="range" min="0" max="100" value="30" 
               class="range-input range-left"
               id="left-1"
               oninput="updateSlider('1', this.value, document.getElementById('right-1').value)">
        
        <!-- Right thumb -->
        <input type="range" min="0" max="100" value="70" 
               class="range-input range-right"
               id="right-1"
               oninput="updateSlider('1', document.getElementById('left-1').value, this.value)">
      </div>
      <div class="values">
        <span class="value-left" id="val-left-1">30</span>
        <span class="value-right" id="val-right-1">70</span>
      </div>
    </div>
    
    <!-- Example 2 -->
    <div class="slider-wrapper">
      <div class="label">Duration Range (0–100)</div>
      <div class="track">
        <div class="rail"></div>
        <div class="fill" id="fill-2" style="left: 25%; width: 50%; background: #f0883e; opacity: 0.6;"></div>
        
        <input type="range" min="0" max="100" value="25" 
               class="range-input range-left"
               id="left-2"
               oninput="updateSlider('2', this.value, document.getElementById('right-2').value)">
        
        <input type="range" min="0" max="100" value="75" 
               class="range-input range-right"
               id="right-2"
               oninput="updateSlider('2', document.getElementById('left-2').value, this.value)">
      </div>
      <div class="values">
        <span class="value-left" id="val-left-2">25</span>
        <span class="value-right" id="val-right-2">75</span>
      </div>
    </div>
  </div>

  <script>
    const MIN_GAP = 8;
    
    function updateSlider(id, valLeft, valRight) {
      let a = parseInt(valLeft);
      let b = parseInt(valRight);
      
      // Enforce minimum gap
      if (a >= b - MIN_GAP) {
        a = b - MIN_GAP;
        document.getElementById('left-' + id).value = a;
      }
      if (b <= a + MIN_GAP) {
        b = a + MIN_GAP;
        document.getElementById('right-' + id).value = b;
      }
      
      // Update fill
      const fill = document.getElementById('fill-' + id);
      fill.style.left = Math.min(a, b) + '%';
      fill.style.width = Math.abs(b - a) + '%';
      
      // Update values display
      document.getElementById('val-left-' + id).textContent = a;
      document.getElementById('val-right-' + id).textContent = b;
    }
  </script>
</body>
</html>
