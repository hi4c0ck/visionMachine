<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TwoThumbSlider — CSS-Tricks Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
      padding: 40px;
    }
    
    .demo { max-width: 500px; margin: 0 auto; }
    h1 { color: #a8b5d6; margin-bottom: 8px; font-weight: 500; }
    p.subtitle { font-size: 12px; color: #6e7681; margin-bottom: 32px; }
    
    /* ── Slider Styles ─────────────────── */
    .slider {
      --tension: #58a6ff;
      display: flex; flex-direction: column; gap: 4px;
      width: 100%;
    }
    
    .label { font-size: 9px; color: #6e7681; text-transform: uppercase; }
    
    .track-container {
      position: relative;
      height: 28px;
      cursor: pointer;
    }
    
    .rail {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      left: 0; right: 0;
      height: 6px;
      background: #2a2a3a;
      border-radius: 3px;
    }
    
    .fill {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      height: 6px;
      background: var(--tension);
      opacity: 0.5;
      border-radius: 3px;
      pointer-events: none;
    }
    
    /* Range inputs */
    .input {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      margin: 0;
      cursor: grab;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
    }
    
    /* Left thumb on top */
    .input-a { z-index: 2; }
    /* Right thumb behind */
    .input-b { z-index: 1; }
    
    /* Hide default tracks */
    .input::-webkit-slider-runnable-track { height: 6px; background: transparent; }
    .input::-moz-range-track { height: 6px; background: transparent; border: none; }
    
    /* Left thumb (blue) */
    .input-a::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8d8e8, #8ba4c4);
      border: 2px solid #6a8ab5;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      cursor: grab;
      margin-top: -6px;
    }
    
    .input-a::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8d8e8, #8ba4c4);
      border: 2px solid #6a8ab5;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      cursor: grab;
    }
    
    /* Right thumb (green) */
    .input-b::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8e8d0, #7fb89a);
      border: 2px solid #5a9a78;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      cursor: grab;
      margin-top: -6px;
    }
    
    .input-b::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8e8d0, #7fb89a);
      border: 2px solid #5a9a78;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      cursor: grab;
    }
    
    /* Hover effects */
    .input-a:hover::-webkit-slider-thumb { transform: scale(1.1); }
    .input-b:hover::-webkit-slider-thumb { transform: scale(1.1); }
    
    /* Examples */
    .example {
      margin-bottom: 24px;
      padding: 16px;
      background: #161b22;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    
    .example-title {
      font-size: 10px; font-weight: 600; color: #8b949e;
      text-transform: uppercase; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="demo">
    <h1>TwoThumbSlider — CSS-Tricks Demo</h1>
    <p class="subtitle">Stacked native range inputs technique</p>
    
    <!-- Example 1 -->
    <div class="example">
      <div class="example-title">Blue Theme (0–100)</div>
      <div class="slider" style="--tension: #58a6ff;">
        <div class="label">Position</div>
        <div class="track-container">
          <div class="rail"></div>
          <div class="fill" id="fill1" style="left: 30%; width: 40%;"></div>
          
          <!-- Left thumb input (higher z-index) -->
          <input type="range" min="0" max="62" step="1" value="30" 
                 class="input input-a"
                 oninput="updateSlider('s1', this.value, document.getElementById('b1').value)">
          
          <!-- Right thumb input (lower z-index) -->
          <input type="range" min="38" max="100" step="1" value="70" 
                 class="input input-b"
                 id="b1"
                 oninput="updateSlider('s1', document.getElementById('a1').value, this.value)">
        </div>
      </div>
    </div>
    
    <!-- Example 2 -->
    <div class="example">
      <div class="example-title">Orange Theme (0–100)</div>
      <div class="slider" style="--tension: #f0883e;">
        <div class="label">Duration</div>
        <div class="track-container">
          <div class="rail"></div>
          <div class="fill" id="fill2" style="left: 25%; width: 50%;"></div>
          
          <input type="range" min="0" max="67" step="1" value="25" 
                 class="input input-a"
                 id="a2"
                 oninput="updateSlider('s2', this.value, document.getElementById('b2').value)">
          
          <input type="range" min="33" max="100" step="1" value="75" 
                 class="input input-b"
                 id="b2"
                 oninput="updateSlider('s2', document.getElementById('a2').value, this.value)">
        </div>
      </div>
    </div>
  </div>

  <script>
    const MIN_GAP = 8;
    
    function updateSlider(id, valA, valB) {
      const a = parseInt(valA);
      const b = parseInt(valB);
      
      // Enforce minimum gap
      if (a >= b - MIN_GAP) {
        // Left thumb too close to right, push it back
        const newA = b - MIN_GAP;
        document.querySelector(`#${id.replace('s','')} .input-a`).value = newA;
      }
      
      if (b <= a + MIN_GAP) {
        // Right thumb too close to left, push it forward
        const newB = a + MIN_GAP;
        document.querySelector(`#${id.replace('s','')} .input-b`).value = newB;
      }
      
      // Update fill
      const actualA = parseInt(document.querySelector(`#${id.replace('s','')} .input-a`).value);
      const actualB = parseInt(document.querySelector(`#${id.replace('s','')} .input-b`).value);
      const fill = document.getElementById('fill' + id.replace('s',''));
      if (fill) {
        fill.style.left = Math.min(actualA, actualB) + '%';
        fill.style.width = Math.abs(actualB - actualA) + '%';
      }
    }
  </script>
</body>
</html>
