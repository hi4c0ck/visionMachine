<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionMachine - Minimal Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #2d2d2d;
      border-radius: 8px;
      border: 2px solid #4ec9b0;
    }
    h1 { color: #4ec9b0; margin-bottom: 20px; }
    p { margin: 10px 0; }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
    }
    .ok { background: #22c55e; }
    .error { background: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VISION MACHINE TEST</h1>
    <p>If you see this text, the HTML is loading correctly.</p>
    <div id="status" class="status ok">
      ✓ Frontend base path is correct<br>
      ✓ HTML structure is valid<br>
      ✓ CSS is applied
    </div>
    <p style="margin-top: 30px; color: #888; font-size: 12px;">
      This is a minimal test to verify basic functionality.<br>
      The full Svelte app should load below if configured correctly.
    </p>
  </div>
  
  <script>
    // Log what we can
    console.log('Minimal test loaded successfully');
    console.log('Window location:', window.location.href);
    console.log('Document ready state:', document.readyState);
    
    // Try to load the real app
    const script = document.createElement('script');
    script.type = 'module';
    script.src = './assets/index-D3-hMLDt.js';
    script.onload = () => {
      console.log('Svelte bundle loaded successfully!');
      document.getElementById('status').innerHTML += '<br>✓ Svelte JS bundle loaded';
    };
    script.onerror = (e) => {
      console.error('Failed to load Svelte bundle:', e);
      document.getElementById('status').className = 'status error';
      document.getElementById('status').innerHTML += '<br>✗ Failed to load JS bundle';
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
